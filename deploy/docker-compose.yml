# MultiVoice 基礎設施（跑在有固定公開 IP 的這台電腦，見 PLAN.md §7.3）
#
#   caddy       HTTPS 憑證（Let's Encrypt）+ 網頁版 + 反向代理 relay
#   iroh-relay  自架 relay；憑證直接讀 Caddy 申請好的檔案（Reloading 模式，自動跟著續期）
#   room-server 常駐房間（給 Play 商店審查人員等用的測試房間），邀請票：
#               docker compose -f deploy/docker-compose.yml exec room-server cat /data/ticket.txt
#
# 對外需要轉發到這台電腦的埠：TCP 80、TCP 443、UDP 7842
#
#   docker compose -f deploy/docker-compose.yml up -d
name: multivoice

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 驗證、轉址到 HTTPS
      - "443:443"   # HTTPS（網頁版 + relay 的 WebSocket）
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

  iroh-relay:
    # 版本必須與 Cargo.lock 中的 iroh 一致
    image: n0computer/iroh-relay:v1.4.1
    restart: unless-stopped
    command: ["--config-path", "/etc/iroh-relay/relay.toml"]
    environment:
      # 存取權杖（iroh-relay.toml 的 access.shared_token 生效時才有作用）；值在 deploy/.env（不納入 git）
      IROH_RELAY_ACCESS_TOKEN: ${MULTIVOICE_RELAY_TOKEN:-}
    ports:
      - "7842:7842/udp"   # QUIC 位址探測（QAD），幫助打洞；不經 Caddy
    volumes:
      - ./iroh-relay.toml:/etc/iroh-relay/relay.toml:ro
      - caddy_data:/caddy-data:ro
    depends_on:
      - caddy

  room-server:
    build:
      context: ..
      dockerfile: deploy/room-server.Dockerfile
      secrets:
        - multivoice_relay_token
    restart: unless-stopped
    # 頻道每次啟動都建好；房間 ID／密鑰存在 room_data（刪掉 volume＝換新房間，舊邀請連結失效）
    command: ["--channel", "小隊A", "--channel", "小隊B", "--channel", "指揮"]
    volumes:
      - room_data:/data

secrets:
  # 值在 deploy/.env（不納入 git）
  multivoice_relay_token:
    environment: MULTIVOICE_RELAY_TOKEN

volumes:
  caddy_data:
  caddy_config:
  room_data:
