# iroh-relay 1.4.1 設定（欄位見 iroh-relay crate 的 src/main.rs `Config`）

enable_relay = true
# 只剩 captive portal 偵測會用到，不對外
http_bind_addr = "[::]:8080"
# QUIC 位址探測：讓客戶端得知自己的公開位址，提高打洞成功率
enable_quic_addr_discovery = true
enable_metrics = false
# 存取控制：只讓帶權杖的 MultiVoice 客戶端使用（權杖由環境變數 IROH_RELAY_ACCESS_TOKEN 帶入，見 docker-compose.yml、deploy/.env）。
# 分兩階段：先發佈會帶權杖的客戶端（v0.8.0 起）與網頁版，大家更新後再把下面改成 shared_token 並重啟 iroh-relay。
# 舊版客戶端之後連不上這個 relay，只能用 n0 的公共 relay（跨網路可能連不上用新版的房主）。
access = "everyone"
# access.shared_token = ["由環境變數 IROH_RELAY_ACCESS_TOKEN 覆蓋"]

[tls]
https_bind_addr = "[::]:8443"
quic_bind_addr = "[::]:7842"
# 讀 Caddy 申請好的憑證檔，檔案更新（續期）時自動重新載入
cert_mode = "Reloading"
manual_cert_path = "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/relay.xiaoyu0708.ip-ddns.com/relay.xiaoyu0708.ip-ddns.com.crt"
manual_key_path = "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/relay.xiaoyu0708.ip-ddns.com/relay.xiaoyu0708.ip-ddns.com.key"
