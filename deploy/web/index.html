<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiVoice</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1b1b1f; --muted: #6b6b76; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141417; --fg: #ececf1; --muted: #9a9aa6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, "Microsoft JhengHei", sans-serif; padding: 0 16px; }
  main { max-width: 32rem; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>MultiVoice</h1>
  <p>網頁版客戶端尚在開發中（M7）。這個頁面目前用來確認 HTTPS 憑證運作正常。</p>
</main>
</body>
</html>
