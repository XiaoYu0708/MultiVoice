[package]
name = "web-dfn"
description = "MultiVoice 網頁版的強力降噪（DeepFilterNet3），獨立的 wasm 模組，開了才下載"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 權重（約 5 MB）直接編進 wasm：一個檔案就好，不用另外下載對齊
dfn3_rs = { version = "0.1.2", features = ["embedded-model"] }
