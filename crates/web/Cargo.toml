[package]
name = "web"
description = "MultiVoice 網頁客戶端（瀏覽器主執行緒）：iroh 連線、房間狀態、語音封包收送；音訊在 web-audio（AudioWorklet）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
client-core = { path = "../client-core" }
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
protocol = { path = "../protocol" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
transport = { path = "../transport" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# 瀏覽器沒有作業系統亂數：各版本的 getrandom 都要指定用 Web Crypto
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
