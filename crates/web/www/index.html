<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="description" content="MultiVoice 網頁版：同時收聽、同時對多個頻道說話的遊戲語音">
<title>MultiVoice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 加入畫面 -->
<main id="join-view" class="view">
  <header class="brand">
    <img src="icon.svg" alt="" width="40" height="40">
    <div>
      <h1>MultiVoice</h1>
      <p class="muted">網頁版<span id="version"></span></p>
    </div>
  </header>

  <form id="join-form" class="panel" autocomplete="off">
    <label class="field">
      <span>你的名稱</span>
      <input id="name" maxlength="32" required placeholder="例如：小明">
    </label>
    <label class="field">
      <span>邀請票</span>
      <textarea id="ticket" rows="3" required spellcheck="false" placeholder="貼上 mv1 開頭的邀請票，或直接打開別人傳的邀請連結"></textarea>
    </label>
    <p id="join-error" class="error" hidden></p>
    <button id="join-btn" type="submit" class="primary big">加入房間</button>
  </form>

  <section class="notes">
    <h2>使用前請注意</h2>
    <ul>
      <li>需要允許使用麥克風。不允許的話仍然可以只聽。</li>
      <li><b>手機切到其他 App 或鎖定螢幕時，瀏覽器會中斷麥克風</b>（iPhone 一定會，Android 不一定）。
        網頁版適合用另一台裝置在旁邊聽、說，或在電腦的瀏覽器上使用。</li>
      <li>網頁版一律經過轉送伺服器連線，延遲比桌面版多一點，也不能當房主。</li>
      <li>用喇叭時請開著瀏覽器的回音消除（預設已開），避免別人聽到自己的回音。</li>
    </ul>
  </section>
</main>

<!-- 房間畫面 -->
<main id="room-view" class="view" hidden>
  <header class="topbar">
    <div class="status">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text">連線中…</span>
    </div>
    <div class="top-actions">
      <button id="invite-btn" class="ghost" type="button">複製邀請連結</button>
      <button id="leave-btn" class="ghost danger" type="button">離開</button>
    </div>
  </header>

  <section class="controls panel">
    <div class="row">
      <button id="mute-btn" class="toggle" type="button" aria-pressed="false">麥克風開</button>
      <button id="deafen-btn" class="toggle" type="button" aria-pressed="false">收聽中</button>
    </div>
    <div class="meter" aria-hidden="true"><div id="meter-fill"></div><div id="meter-gate"></div></div>
    <p id="mic-text" class="muted small">麥克風：—</p>
    <p id="mic-warning" class="warn small" hidden><span id="mic-warning-text"></span>
      <button id="mic-retry" class="ghost" type="button" hidden>開啟麥克風</button></p>
  </section>

  <section>
    <div class="section-head">
      <h2>頻道</h2>
      <span id="member-count" class="muted small"></span>
    </div>
    <div id="channels"></div>
    <form id="new-channel" class="new-channel">
      <input id="new-channel-name" maxlength="32" placeholder="新頻道名稱">
      <button type="submit" class="ghost">新增頻道</button>
    </form>
  </section>

  <details class="panel settings">
    <summary>音訊設定</summary>
    <label class="field">
      <span>輸出音量 <b id="volume-val"></b></span>
      <input id="volume" type="range" min="0" max="2" step="0.05">
    </label>
    <label class="field">
      <span>說話偵測門檻 <b id="gate-val"></b></span>
      <input id="gate" type="range" min="-70" max="-20" step="1">
      <small class="muted">「偵測說話」模式下聲音比門檻大才送出。背景吵就調高，講話常被切掉就調低。</small>
    </label>
    <label class="check"><input id="cues" type="checkbox"> 開／關麥提示音</label>
    <label class="check"><input id="wakelock" type="checkbox"> 在房間裡時保持螢幕開啟（手機建議開）</label>
    <p class="muted small" id="net-text"></p>
  </details>

  <ol id="log" class="log"></ol>
</main>

<template id="channel-tpl">
  <article class="card">
    <div class="card-head">
      <h3 class="ch-name"></h3>
      <span class="ch-count muted small"></span>
      <button class="join ghost" type="button"></button>
    </div>
    <ul class="chips"></ul>
    <div class="ch-controls">
      <div class="row wrap">
        <label class="inline">說話
          <select class="mode">
            <option value="vad">偵測說話</option>
            <option value="open">一直開麥</option>
            <option value="ptt">按住說話</option>
            <option value="off">不說話</option>
          </select>
        </label>
      </div>
      <label class="field compact">
        <span>頻道音量 <b class="vol-val"></b></span>
        <input class="vol" type="range" min="0" max="2" step="0.05">
      </label>
      <button class="ptt" type="button">按住說話</button>
    </div>
  </article>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
