[package]
name = "desktop"
description = "MultiVoice 桌面客戶端（egui）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "multivoice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
audio = { path = "../audio" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wgpu_no_default_features"] }
# OpenGL 不能用時的備援：只開 DirectX 12（含軟體繪製 WARP），不帶 Vulkan／GLES 以免執行檔太大
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12"] }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
session = { path = "../session" }
tokio = { version = "1", features = ["full"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
raw-window-handle = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
