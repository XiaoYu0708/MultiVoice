[package]
name = "audio"
description = "MultiVoice 原生音訊：擷取/播放/重取樣/降噪/VAD/Opus/jitter buffer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18"
mixer-core = { path = "../mixer-core" }
opus = "0.4"
rtrb = "0.4"
rubato = "5"
# 強力降噪（DeepFilterNet3，權重內嵌約 5 MB）
dfn3_rs = { version = "0.1.2", features = ["embedded-model"] }
