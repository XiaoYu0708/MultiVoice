[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/audio",
    "crates/mixer-core",
    "crates/transport",
    "crates/host-core",
    "crates/client-core",
    "crates/cli",
    "crates/netprobe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
