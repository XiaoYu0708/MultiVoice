[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/audio",
    "crates/mixer-core",
    "crates/transport",
    "crates/host-core",
    "crates/client-core",
    "crates/hotkeys",
    "crates/session",
    "crates/cli",
    "crates/room-server",
    "crates/desktop",
    "crates/netprobe",
    "crates/web",
    "crates/web-audio",
    "crates/web-dfn",
]
# 修改過的第三方 crate（用 [patch] 取代 crates.io 版本）
exclude = ["vendor"]

[workspace.package]
version = "0.10.5"
edition = "2024"
publish = false

# DeepFilterNet3：加上 wasm SIMD128 kernel 給網頁版用（vendor/dfn3_rs/MULTIVOICE.md）
[patch.crates-io]
dfn3_rs = { path = "vendor/dfn3_rs" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 網頁版（tools/build-web.sh）：體積優先；只去掉除錯資訊，wasm-bindgen 需要 target_features 區段
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

# 音訊引擎不經過 wasm-bindgen，可以完全去掉符號
[profile.wasm.package.web-audio]
strip = true
